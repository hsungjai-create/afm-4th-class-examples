<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신사 맛집 인스타 픽</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes ringPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.25); }
      50% { box-shadow: 0 0 0 8px rgba(236, 72, 153, 0); }
    }
    .story-ring { animation: ringPulse 2.4s ease-in-out infinite; }
    .fade-up { animation: fadeUp 0.6s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-neutral-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Badge({ children, className = "" }) {
      return (
        <span className={`inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-semibold ${className}`}>
          {children}
        </span>
      );
    }

    function RankBadge({ rank }) {
      const styles = {
        1: "bg-gradient-to-br from-amber-400 to-yellow-500 text-white",
        2: "bg-gradient-to-br from-slate-300 to-slate-400 text-white",
        3: "bg-gradient-to-br from-orange-300 to-orange-500 text-white",
      };
      return (
        <div className={`absolute -top-4 -left-4 h-12 w-12 rounded-full flex items-center justify-center text-lg font-bold shadow-lg ring-4 ring-white ${styles[rank]}`}>
          {rank}
        </div>
      );
    }

    function StarRating({ rating }) {
      return (
        <div className="flex items-center gap-1 text-amber-500">
          <span className="text-base">★</span>
          <span className="font-bold text-neutral-800">{rating}</span>
        </div>
      );
    }

    function Card({ children, className = "" }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm ring-1 ring-neutral-100 overflow-hidden ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================

    function Header() {
      return (
        <header className="relative overflow-hidden bg-gradient-to-br from-fuchsia-500 via-pink-500 to-orange-400 text-white">
          <div className="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_20%_20%,white,transparent_35%),radial-gradient(circle_at_80%_60%,white,transparent_30%)]"></div>
          <div className="relative max-w-3xl mx-auto px-6 py-14 sm:py-20 text-center">
            <div className="story-ring inline-flex h-16 w-16 items-center justify-center rounded-full bg-white/15 backdrop-blur text-3xl mb-4 ring-2 ring-white/70">
              🍽️
            </div>
            <p className="uppercase tracking-[0.3em] text-xs sm:text-sm text-white/80 mb-2">Sinsa Food Pick</p>
            <h1 className="text-3xl sm:text-5xl font-extrabold drop-shadow-sm">신사 맛집 인스타 픽</h1>
            <p className="mt-4 text-sm sm:text-base text-white/90">
              방문자 리뷰가 많고 평점이 높은 신사 지역 맛집 3곳, 인스타 감성으로 골라봤어요
            </p>
          </div>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="py-10 text-center text-xs text-neutral-400">
          네이버 검색·플레이스 데이터를 기반으로 선정했어요 · 방문 전 최신 정보를 확인하세요
        </footer>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================

    const RESTAURANTS = [
      {
        rank: 1,
        name: "트라가 가로수길점",
        category: "스페인음식",
        rating: "4.89",
        reviews: "1.9만",
        image: "./신사맛집_1_트라가.png",
        desc: "트라가빠에야, 하몽, 생맥주 등 스페인 요리 전문. 리뷰 수가 압도적으로 많아 대중적으로 검증된 맛집",
        tags: ["#스페인요리", "#빠에야", "#가로수길"],
      },
      {
        rank: 2,
        name: "신사만장어",
        category: "장어·먹장어요리",
        rating: "4.89",
        reviews: "1.1만",
        image: "./신사맛집_2_신사만장어.png",
        desc: "고급 한식 보양식 콘셉트의 장어 전문점. 장어덮밥 3대 맛집으로 알려져 있으며 재방문율이 높음",
        tags: ["#보양식", "#장어덮밥", "#재방문율"],
      },
      {
        rank: 3,
        name: "청기와타운 신사역점",
        category: "육류·고기요리",
        rating: "4.86",
        reviews: "6,521",
        image: "./신사맛집_3_청기와타운.png",
        desc: "회식·모임에 적합한 고기요리 전문점. 네이버 예약 시 회식비 지원 쿠폰 제공",
        tags: ["#회식", "#모임", "#고기요리"],
      },
    ];

    function RestaurantCard({ item, index }) {
      return (
        <Card className="fade-up" style={{ animationDelay: `${index * 0.1}s` }}>
          <div className="relative">
            <img
              src={item.image}
              alt={item.name}
              className="w-full h-64 sm:h-80 object-cover"
              loading="lazy"
            />
            <RankBadge rank={item.rank} />
            <div className="absolute top-4 right-4">
              <Badge className="bg-black/60 text-white backdrop-blur">
                ❤️ 리뷰 {item.reviews}
              </Badge>
            </div>
          </div>
          <div className="p-5 sm:p-6">
            <div className="flex items-start justify-between gap-3">
              <div>
                <h2 className="text-xl font-bold text-neutral-900">{item.name}</h2>
                <p className="text-sm text-neutral-500 mt-0.5">{item.category}</p>
              </div>
              <StarRating rating={item.rating} />
            </div>
            <p className="mt-3 text-sm text-neutral-600 leading-relaxed">{item.desc}</p>
            <div className="mt-4 flex flex-wrap gap-2">
              {item.tags.map((tag) => (
                <Badge key={tag} className="bg-fuchsia-50 text-fuchsia-600">
                  {tag}
                </Badge>
              ))}
            </div>
          </div>
        </Card>
      );
    }

    function SummaryTable() {
      return (
        <Card className="fade-up">
          <div className="p-5 sm:p-6">
            <h3 className="text-lg font-bold text-neutral-900 mb-4">한눈에 비교하기</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-sm text-left">
                <thead>
                  <tr className="text-neutral-400 border-b border-neutral-100">
                    <th className="py-2 pr-4 font-medium">순위</th>
                    <th className="py-2 pr-4 font-medium">매장</th>
                    <th className="py-2 pr-4 font-medium">카테고리</th>
                    <th className="py-2 pr-4 font-medium">평점</th>
                    <th className="py-2 font-medium">리뷰 수</th>
                  </tr>
                </thead>
                <tbody>
                  {RESTAURANTS.map((item) => (
                    <tr key={item.rank} className="border-b border-neutral-50 last:border-0">
                      <td className="py-3 pr-4">
                        <span className="inline-flex h-6 w-6 items-center justify-center rounded-full bg-neutral-100 text-xs font-bold text-neutral-600">
                          {item.rank}
                        </span>
                      </td>
                      <td className="py-3 pr-4 font-semibold text-neutral-800">{item.name}</td>
                      <td className="py-3 pr-4 text-neutral-500">{item.category}</td>
                      <td className="py-3 pr-4 text-amber-500 font-semibold">★ {item.rating}</td>
                      <td className="py-3 text-neutral-500">{item.reviews}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </Card>
      );
    }

    function HomePage() {
      return (
        <main className="max-w-3xl mx-auto px-4 sm:px-6 -mt-10 sm:-mt-14 pb-16 space-y-8">
          {RESTAURANTS.map((item, index) => (
            <RestaurantCard key={item.rank} item={item} index={index} />
          ))}
          <SummaryTable />
        </main>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return (
        <div>
          <Header />
          <HomePage />
          <Footer />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
